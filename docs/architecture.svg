<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#1a0b3a"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#00f0ff"/>
    </marker>
    <marker id="arrowP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff2ec4"/>
    </marker>
  </defs>
  <rect width="900" height="520" rx="12" fill="url(#bg)"/>
  <text x="450" y="42" text-anchor="middle" fill="#00f0ff" font-size="22" font-weight="bold" filter="url(#glow)">SaaS Mall 多租户电商 · 秒杀架构</text>

  <!-- 前端 -->
  <rect x="40" y="80" width="170" height="90" rx="10" fill="#1a0b3a" stroke="#00f0ff" stroke-opacity="0.5"/>
  <text x="125" y="120" text-anchor="middle" fill="#00f0ff" font-size="15" font-weight="bold">Vue3 前端</text>
  <text x="125" y="145" text-anchor="middle" fill="#9d9dcc" font-size="11">秒杀页 · 轮询状态</text>

  <!-- 后端 -->
  <rect x="290" y="70" width="270" height="110" rx="10" fill="#1a0b3a" stroke="#ff2ec4" stroke-opacity="0.6"/>
  <text x="425" y="100" text-anchor="middle" fill="#ff2ec4" font-size="15" font-weight="bold" filter="url(#glow)">Spring Boot 后端</text>
  <text x="425" y="125" text-anchor="middle" fill="#e6e6fa" font-size="11">JwtInterceptor → ThreadLocal tenantId</text>
  <text x="425" y="145" text-anchor="middle" fill="#e6e6fa" font-size="11">TenantLineInterceptor: WHERE tenant_id = ?</text>
  <text x="425" y="165" text-anchor="middle" fill="#e6e6fa" font-size="11">SeckillController → Lua 预扣 → 发 MQ</text>

  <!-- Redis -->
  <rect x="650" y="60" width="210" height="90" rx="10" fill="#1a0b3a" stroke="#00f0ff" stroke-opacity="0.6"/>
  <text x="755" y="92" text-anchor="middle" fill="#00f0ff" font-size="15" font-weight="bold">Redis 7</text>
  <text x="755" y="115" text-anchor="middle" fill="#9d9dcc" font-size="11">Lua 原子预扣库存 + Set 防重</text>
  <text x="755" y="134" text-anchor="middle" fill="#9d9dcc" font-size="11">排队状态 key（前端轮询）</text>

  <!-- RabbitMQ -->
  <rect x="610" y="290" width="180" height="80" rx="10" fill="#1a0b3a" stroke="#f9f002" stroke-opacity="0.6"/>
  <text x="700" y="322" text-anchor="middle" fill="#f9f002" font-size="15" font-weight="bold">RabbitMQ</text>
  <text x="700" y="345" text-anchor="middle" fill="#9d9dcc" font-size="11">seckill.order.queue 削峰</text>

  <!-- MySQL -->
  <rect x="270" y="290" width="210" height="90" rx="10" fill="#1a0b3a" stroke="#ff2ec4" stroke-opacity="0.6"/>
  <text x="375" y="322" text-anchor="middle" fill="#ff2ec4" font-size="15" font-weight="bold">MySQL (saas_mall)</text>
  <text x="375" y="345" text-anchor="middle" fill="#9d9dcc" font-size="11">乐观锁: stock-1 WHERE stock&gt;=1</text>
  <text x="375" y="364" text-anchor="middle" fill="#9d9dcc" font-size="11">tenant / product / orders ...</text>

  <!-- 消费者 -->
  <rect x="270" y="430" width="210" height="60" rx="10" fill="#1a0b3a" stroke="#f9f002" stroke-opacity="0.5"/>
  <text x="375" y="466" text-anchor="middle" fill="#f9f002" font-size="13">Consumer 落库 + 回滚兜底</text>

  <!-- 连线 -->
  <line x1="210" y1="125" x2="285" y2="125" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="105" x2="645" y2="105" stroke="#00f0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="600" y="95" text-anchor="middle" fill="#00f0ff" font-size="10">Lua 预扣</text>
  <line x1="500" y1="180" x2="655" y2="310" stroke="#f9f002" stroke-width="2" marker-end="url(#arrowP)"/>
  <text x="590" y="250" fill="#f9f002" font-size="10">异步下单消息</text>
  <line x1="690" y1="370" x2="485" y2="455" stroke="#f9f002" stroke-width="2" marker-end="url(#arrowP)"/>
  <line x1="375" y1="430" x2="375" y2="385" stroke="#ff2ec4" stroke-width="2" marker-end="url(#arrowP)"/>
  <line x1="640" y1="150" x2="640" y2="330" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="620" y="255" fill="#00f0ff" font-size="10">状态查询</text>

  <!-- 防线标注 -->
  <rect x="40" y="290" width="180" height="180" rx="10" fill="#0d0221" stroke="#39ff14" stroke-opacity="0.4"/>
  <text x="130" y="315" text-anchor="middle" fill="#39ff14" font-size="13" font-weight="bold">防超卖三道防线</text>
  <text x="130" y="345" text-anchor="middle" fill="#e6e6fa" font-size="11">1. Redis Lua 原子预扣</text>
  <text x="130" y="375" text-anchor="middle" fill="#e6e6fa" font-size="11">2. DB 乐观锁 stock&gt;=1</text>
  <text x="130" y="405" text-anchor="middle" fill="#e6e6fa" font-size="11">3. Set 防同用户重复</text>
  <text x="130" y="435" text-anchor="middle" fill="#e6e6fa" font-size="11">消费失败回滚配额</text>
</svg>
